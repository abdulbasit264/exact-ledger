name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: shivammathur/setup-php@2.31.1
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
